<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Items CRUD</title>
    <link rel="stylesheet" href="./main.css">
</head>

<body>
<div class="login__wrapper">
    <div class="login">
        <h2 class="login__title">Login</h2>

        <p class="login__error">Error message</p>

        <form action="#" method="POST">
            <div class="login__form-group">
                <label for="email" class="login__label">Email</label>
                <input type="email" id="email" name="email" required class="login__input">
            </div>

            <div class="login__form-group">
                <label for="password" class="login__label">Password</label>
                <input type="password" id="password" name="password" required class="login__input">
            </div>

            <button type="submit" class="login__button">Login</button>
        </form>
    </div>
</div>

</body>

</html>
